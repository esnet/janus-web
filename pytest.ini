[pytest]
DJANGO_SETTINGS_MODULE = webapp.settings
pythonpath = webapp
markers =
    integration: marks tests as integration tests requiring a live janus-web + controller instance (deselect with '-m "not integration"')
testpaths = webapp
python_files = tests.py test_*.py *_tests.py
addopts = -v
filterwarnings =
    ignore::DeprecationWarning