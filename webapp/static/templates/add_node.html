{% extends 'base.html' %}
{% block title %} Add a Janus Node {% endblock title %}
{% block content %}

<div class="panel panel-default">
    {% if data.errors|length %}
    <div class="alert alert-danger" role="alert">
      {% for err in data.errors %}
      <b>{{ err }}</b><br/>
      {% endfor %}
    </div>
    {% endif %}
    <div class="panel-heading">
	<h1 class="text-center"><strong><i>Node Connection Details</i></strong></h1>
    </div>
    <div class="panel-body">
	<div align="center">
	    <form class="form-group" action="{% url 'janus:add_node' %}" method="post" id="node_post_form" style="width:60%">
		{% csrf_token %}
		<div class="rows" style="padding-top: 2%">
		    <div>
			<label>Node Name:</label>
			<input class="form-control" type="text" id="name" name="name" placeholder="node name" >
		    </div>
		</div>

                <div class="rows" style="padding-top: 2%">
		    <div>
			<label>Node URL:</label>
			<input class="form-control" type="text" id="url" name="url" placeholder="tcp://localhost:9001" >
		    </div>
		</div>

	        <div class="rows" style="padding-top: 2%">
	          <div>
	            <label>Node Type:</label>
	            <select class="form-control" name="ntype">
	              {% for k,v in ntypes.items %}
	              <option value="{{ k }}" label="{{ v }}"></option>
	              {% endfor %}
	            </select>
	          </div>
	        </div>

		<div class="row" style="padding-left:10%; padding-right:10%; padding-top: 2%">
                    <div class="col-sm-4">
                	<button class="btn btn-lg btn-block btn-success" type="submit"><i class="glyphicon glyphicon-ok-sign"></i>Add</button>
                    </div>
                    <div class="col-sm-4">
                	<button class="btn btn-lg btn-block btn-warning" type="reset"><i class="glyphicon glyphicon-repeat"></i>Reset</button>
                    </div>
                    <div class="col-sm-4">
                        <a class="btn btn-lg btn-block btn-secondary" href="../"><i class="glyphicon glyphicon-repeat"></i>Cancel</a>
                    </div>
                </div>
	    </form>
	</div>
    </div>
</div>

{% endblock content %}
