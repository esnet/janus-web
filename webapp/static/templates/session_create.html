{% extends 'base.html' %}
<!--{% load bootstrap4 %}-->
<!--{% bootstrap_css %}-->
<!--{% bootstrap_javascript jquery='full' %}-->
<!--{% load crispy_forms_tags %}-->
{% block content %}

<div class="panel panel-default">
    <div align="center">
      {% if data.errors|length %}
    <div class="alert alert-danger" role="alert">
      {% for err in data.errors %}
      <b>{{ err }}</b><br/>
      {% endfor %}
    </div>
    {% endif %}

    <div class="card bg-light mb-3" style="width: 60%">
      <div class="card-header align-items-center">
	<b>Create New Session</b>
      </div>
      <div class="card-body">
        {% csrf_token %}
        {% crispy forms %}
      </div>
    </div>
    </div>
</div>

<script id="clusters-data" type="application/json">
  {{ clusters|safe }}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/1.0.26/vue.js"></script>
<script>
  document.querySelectorAll('div.nodes-app').forEach(x => new Vue({
    el: x,
    data() {
      return {
        rows: [{}]
      };
    }
  }));

  document.addEventListener('DOMContentLoaded', function() {
      const clustersData = JSON.parse(document.getElementById('clusters-data').textContent);

      document.addEventListener('change', function(event) {
          if (event.target && event.target.name === 'node') {
              const selectedNode = event.target.value;
              const clusterSelect = event.target.closest('.form-row').querySelector('select[name="clusters"]');
              const clusters = clustersData[selectedNode] || [];

              // Clear existing options
              clusterSelect.innerHTML = '';

              // Add new options
              clusters.forEach(cluster => {
                  const option = document.createElement('option');
                  option.value = cluster;
                  option.textContent = cluster;
                  clusterSelect.appendChild(option);
              });
          }
      });
  });

</script>

{% endblock content %}
