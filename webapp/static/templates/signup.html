{% extends 'base.html' %}
{% block title %} Signup{% endblock title %}
{% block content %}

<div class="panel panel-default">
    {% if errors|length %}
    <div class="alert alert-danger" role="alert">
      {% for err in errors %}
      <b>{{ err }}</b><br/>
      {% endfor %}
    </div>
    {% endif %}

    <div class="panel-body">
      <div align="center" style="padding-top: 5%">
	<form class="form-group" action="{% url 'signup' %}" method="post" id="session_post_form" style="width:50%">
	  {% csrf_token %}
	  <div class="rows" style="padding-top: 2%">
	    <div>
	      <label>Username:</label>
	      <input class="form-control" type="text" id="username" name="username" placeholder="username" required >
	    </div>
	  </div>
          <div class="rows" style="padding-top: 2%">
	    <div>
	      <label>Email:</label>
	      <input class="form-control" type="text" id="email" name="email" placeholder="e.g. xyz@es.net" required >
	    </div>
	  </div>
          <div class="rows" style="padding-top: 2%">
	    <div>
	      <label>Password:</label>
	      <input class="form-control" type="password" id="password" name="password" placeholder="password" required >
	    </div>
	  </div>
	  <div class="row" style="padding-left:10%; padding-right:10%; padding-top: 4%">
            <div class="col-sm-6">
              <button class="btn btn-lg btn-block btn-warning" type="reset"><i class="glyphicon glyphicon-repeat"></i>Reset</button>
            </div>
            <div class="col-sm-6">
              <button class="btn btn-lg btn-block btn-success" type="submit"><i class="glyphicon glyphicon-ok-sign"></i>Signup</button>
            </div>
          </div>
	</form>
      </div>
    </div>
</div>

{% endblock content %}
