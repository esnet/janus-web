{% extends 'base.html' %}
{% block title %} New Session {% endblock title %}
{% block content %}

<div class="panel panel-default">
      {% if data.errors|length %}
    <div class="alert alert-danger" role="alert">
      {% for err in data.errors %}
      <b>{{ err }}</b><br/>
      {% endfor %}
    </div>
    {% endif %}
    <div class="panel-heading">
	<h1 class="text-center"><strong><i>New Container Profile</i></strong></h1>
    </div>
    <div class="panel-body">
	<div align="center">
	    <form class="form-group" action="{% url 'janus:create_profile' %}" method="post" id="session_post_form" style="width:60%">
		{% csrf_token %}
		<div class="rows" style="padding-top: 2%">
		    <div>
			<label>Profile Name:</label>
			<input class="form-control" type="text" id="name" name="name" placeholder="profile name" >
		    </div>
		</div>

                <div class="rows" style="padding-top: 2%">
		    <div>
			<label>CPU Core Count:</label>
			<input class="form-control" type="text" id="cpu" name="cpu" placeholder="e.g. 4" >
		    </div>
		</div>

                <div class="rows" style="padding-top: 2%">
		    <div>
			<label>Memory (Bytes):</label>
			<input class="form-control" type="text" id="memory" name="memory" placeholder="e.g. 8589934592" >
		    </div>
		</div>

                <div class="rows" style="padding-top: 2%">
		    <div>
			<label>Affinity:</label>
			<input class="form-control" type="text" id="affinity" name="affinity" value="network" >
		    </div>
		</div>

                <div class="rows" style="padding-top: 2%">
		    <div>
			<label>Management Network:</label>
			<input class="form-control" type="text" id="mgmt_net" name="mgmt_net" value="bridge" >
		    </div>
		</div>

                <div class="rows" style="padding-top: 2%">
		    <div>
			<label>Internal Port:</label>
			<input class="form-control" type="text" id="internal_port" name="internal_port" placeholder="e.g. 5000" >
		    </div>
		</div>

		<div class="rows" style="padding-top: 2%">
		    <div>
			<label>Select QoS Profile:</label>
			<select class="form-control" name="qos">
                            <option value=""></option>
			    {% for item in qos %}
			    <option>{{ item }}</option>
			    {% endfor %}
			</select>
		    </div>
		</div>

		<div class="row" style="padding-left:10%; padding-right:10%; padding-top: 2%">
                    <div class="col-sm-4">
                	<button class="btn btn-lg btn-block btn-success" type="submit"><i class="glyphicon glyphicon-ok-sign"></i>Create</button>
                    </div>
                    <div class="col-sm-4">
                	<button class="btn btn-lg btn-block btn-warning" type="reset"><i class="glyphicon glyphicon-repeat"></i>Reset</button>
                    </div>
                    <div class="col-sm-4">
                        <a class="btn btn-lg btn-block btn-secondary" href="../"><i class="glyphicon glyphicon-repeat"></i>Cancel</a>
                    </div>
                </div>
	    </form>
	</div>
    </div>
</div>

{% endblock content %}
