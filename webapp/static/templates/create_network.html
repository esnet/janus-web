{% extends 'base.html' %}
<!--{% load crispy_forms_tags %}-->
{% block content %}

<div class="panel panel-default">
    <div align="center">
      {% if data.errors|length %}
    <div class="alert alert-danger" role="alert">
      {% for err in data.errors %}
      <b>{{ err }}</b><br/>
      {% endfor %}
    </div>
    {% endif %}

    <div class="card bg-light mb-3" style="width: 60%">
      <div class="card-header align-items-center">
	<b>Create New Network</b>
      </div>
      <div class="card-body">
        {% csrf_token %}
        {% crispy forms %}
      </div>
    </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/1.0.26/vue.js"></script>
<script>
  document.querySelectorAll('div.ipam-app').forEach(x => new Vue({
    el: x,
    data() {
      return {
        rows: [{}]
      };
    }
  }));

  document.querySelectorAll('div.options-app').forEach(x => new Vue({
    el: x,
    data() {
      return {
        rows: [{}]
      };
    }
  }));
</script>

{% endblock content %}
