{% extends 'base.html' %}
{% block title %} New Session {% endblock title %}
{% block content %}

<div class="panel panel-default">
      {% if data.errors|length %}
    <div class="alert alert-danger" role="alert">
      {% for err in data.errors %}
      <b>{{ err }}</b><br/>
      {% endfor %}
    </div>
    {% endif %}
    <div class="panel-heading">
	<h1 class="text-center"><strong><i>New Network</i></strong></h1>
    </div>
    <div class="panel-body">
	<div align="center">
	    <form class="form-group" action="{% url 'janus:create_profile' resource='network' %}" method="post" id="session_post_form" style="width:60%">
		{% csrf_token %}
		<div class="rows" style="padding-top: 2%">
		    <div>
			<label>Name:</label>
			<input class="form-control" type="text" id="name" name="name" placeholder="network name" >
		    </div>
		</div>

		<div class="rows" style="padding-top: 2%">
                    <div>
                        <label>Driver:</label>
                        <input class="form-control" type="text" id="driver" name="driver" placeholder="Ex: bridge"  >
                    </div>
                </div>

		<div class="rows" style="padding-top: 2%">
                    <div>
                        <label>Subnets:</label>
                        <input class="form-control" type="text" id="ipam" name="ipam" placeholder="Ex: {'config': [{'subnet': '198.124.238.234/30', 'gateway': '198.124.238.233'}]}"  >
                    </div>
                </div>

		<div class="rows" style="padding-top: 2%">
                    <div>
                        <label>Options:</label>
                        <input class="form-control" type="text" id="options" name="options" placeholder="Ex: {'mtu': 9000}" >
                    </div>
                </div>

        <div style="padding-top: 3%; padding-bottom: 2%">
            <div>
            <input type="checkbox" class="form-check-input" name="enable_ipv6" id="enable_ipv6"/>
            <label class="form-check-label" for="enable_ipv6">Enable IPv6</label>
            </div>
        </div>

		<div class="row" style="padding-left:10%; padding-right:10%; padding-top: 2%">
                    <div class="col-sm-4">
                	<button class="btn btn-lg btn-block btn-success" type="submit"><i class="glyphicon glyphicon-ok-sign"></i>Create</button>
                    </div>
                    <div class="col-sm-4">
                	<button class="btn btn-lg btn-block btn-warning" type="reset"><i class="glyphicon glyphicon-repeat"></i>Reset</button>
                    </div>
                    <div class="col-sm-4">
                        <a class="btn btn-lg btn-block btn-secondary" href="../"><i class="glyphicon glyphicon-repeat"></i>Cancel</a>
                    </div>
                </div>
	    </form>
	</div>
    </div>
</div>

{% endblock content %}
