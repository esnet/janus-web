{% extends 'base.html' %}
{% block title %} New Session {% endblock title %}
{% block content %}

<style>
.form-row {
	border:  1px solid #e2e2e2;
	margin:  10px;
	padding: 20px;
	background: #f2f2f2;
}
.subrow {
	margin: 5px;
	padding:  5px;
}
</style>

<div class="panel panel-default">
  {% if data.errors|length %}
  <div class="alert alert-danger" role="alert">
    {% for err in data.errors %}
    <b>{{ err }}</b><br/>
    {% endfor %}
  </div>
  {% endif %}

  <div class="panel-heading">
    <h1 class="text-center"><strong><i>Create a New Session</i></strong></h1>
  </div>
  <div class="panel-body">
    <div align="center">
      <form class="form-group" action="{% url 'janus:create_session' %}" method="post" id="session_post_form" style="width:60%">
	{% csrf_token %}
        <div class="rows" style="padding-top: 2%">
          <div class="rows" align="center">
            <label>Select Nodes:</label>
          </div>
          <div id="app">
	    <div class="row" v-for="row in rows" style="padding-top: 2%">
              <div class="col">
	        <select class="form-control" name="node" id="" v-model="row.select">
	          {% for item in nodes|dictsort:"name" %}
	          <option value="{{ item.name }}" label="{{ item.name }}"></option>
	          {% endfor %}
	        </select>
	      </div>
              <div class="col-xs-1">
	        <button class="btn btn-success" @click="addRow" type="button">+</button>
              </div>
              <div class="col-xs-1">
	        <button class="btn btn-danger" @click="deleteRow(row)" type="button">x</button>
              </div>
            </div>
          </div>
          <div class="row" style="padding-top: 2%">
	    <div class="col-sm-8">
	      <label>Select Image:</label>
	      <select class="form-control" name="image">
	        {% for item in images|dictsort:"name" %}
	        <option>{{ item.name }}</option>
	        {% endfor %}
	      </select>
	    </div>
            <div class="col-sm-4">
              <label> Image tag: </label>
	      <input class="form-control" type="text" id="image_tag" name="image_tag" placeholder="latest">
            </div>
          </div>
          <div class="rows" style="padding-top: 2%">
	    <div>
	      <label>Select Profile:</label>
	      <select class="form-control" name="profile">
	        {% for item in profiles %}
	        <option>{{ item }}</option>
	        {% endfor %}
	      </select>
	    </div>
          </div>
          <div class="rows" style="padding-top: 2%">
	    <div>
	      <label>SSH User Name:</label>
	      <input class="form-control" type="text" id="ssh_user_name" name="ssh_user_name" >
	    </div>
          </div>
          <div class="rows" style="padding-top: 2%">
	    <div>
	      <label>SSH Public Key:</label>
	      <textarea class="form-control" id="ssh_public_key" name="ssh_public_key" ></textarea>
	    </div>
          </div>
          <div class="row" style="padding-left:10%; padding-right:10%; padding-top: 2%">
            <div class="col-sm-4">
              <button class="btn btn-lg btn-block btn-success" type="submit"><i class="glyphicon glyphicon-ok-sign"></i>Create</button>
            </div>
            <div class="col-sm-4">
              <button class="btn btn-lg btn-block btn-warning" type="reset"><i class="glyphicon glyphicon-repeat"></i>Reset</button>
            </div>
            <div class="col-sm-4">
              <a class="btn btn-lg btn-block btn-secondary" href="../"><i class="glyphicon glyphicon-repeat"></i>Cancel</a>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/1.0.26/vue.js"></script>
<script>
new Vue({
	el: '#app',
	data: {
		rows: [
			{ 'select': 1 }
		]
	},
	methods: {
		addRow: function() {
			this.rows.push({'select': 1 });
		},
		deleteRow: function(row) {
			this.rows.$remove(row);
		}
	}
})
</script>

{% endblock content %}
